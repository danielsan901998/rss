[package]
name = "rss"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
dirs = "6"
feed-rs = "2"
pyo3 = { version = "0.29", features = ["auto-initialize"] }
reqwest = { version = "0.13", features = ["gzip"] }
rusqlite = "0.40"
tokio = { version = "1", features = ["full"] }
